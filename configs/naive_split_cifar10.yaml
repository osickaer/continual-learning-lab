experiment:
  name: experiment-000-split-cifar10-naive
  run_name: exp000-naive-seed-42
  seed: 42
  device: auto
  output_dir: outputs
  tracking_uri: sqlite:///mlflow.db
  artifact_dir: mlartifacts
  deterministic: true

data:
  root: data
  download: true
  train_batch_size: 128
  eval_batch_size: 256
  num_workers: 2
  pin_memory: true
  max_train_samples_per_class: null
  max_eval_samples_per_class: null
  protocol: sequential
  task_classes:
    - [0, 1] # airplane, automobile
    - [2, 3] # bird, cat
    - [4, 5] # deer, dog
    - [6, 7] # frog, horse
    - [8, 9] # ship, truck

model:
  channels: [32, 64]
  hidden_dim: 256
  dropout: 0.2
  num_classes: 10

training:
  method: naive
  epochs_per_task: 15
  optimizer: sgd
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0005
